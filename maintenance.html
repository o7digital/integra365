<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Site en construction</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6fa;
      --card: #ffffff;
      --text: #12263a;
      --muted: #4b5b6a;
      --accent: #0d6efd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top right, #e7eef9 0%, var(--bg) 45%, #edf2f7 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(640px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 14px 40px rgba(18, 38, 58, 0.12);
      border: 1px solid #e6edf5;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      background: #e9f2ff;
      border: 1px solid #cfe2ff;
      border-radius: 999px;
      padding: 6px 10px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.1;
      margin: 0 0 10px;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(16px, 2.4vw, 19px);
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <span class="badge">Maintenance</span>
    <h1 id="title">Site en construction</h1>
    <p>Nous préparons une mise à jour. Merci de revenir bientôt.</p>
  </main>
</body>
</html>
